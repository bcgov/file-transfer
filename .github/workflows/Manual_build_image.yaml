name: Build Image (Manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to build (e.g. feature/my-branch, dev, commit SHA)"
        required: true
        type: string
      image_name:
        description: "GHCR image name (default: file-transfer)"
        required: true
        type: string
        default: "file-transfer"

concurrency:
  group: build-image-manual-${{ inputs.ref }}-${{ inputs.image_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  ORG: bcgov

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Compute image tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short=7 HEAD)"

          REF="${{ inputs.ref }}"
          SAFE_REF="${REF//\//-}"

          # Tag format: <ref>-<sha7>
          echo "tag=${SAFE_REF}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ inputs.image_name }}:${{ steps.tag.outputs.tag }}

      - name: Summary
        shell: bash
        run: |
          echo "Built ref: ${{ inputs.ref }}"
          echo "Image: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ inputs.image_name }}"
          echo "Tag:   ${{ steps.tag.outputs.tag }}"
