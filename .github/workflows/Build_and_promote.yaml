name: Build & Promote (GitOps)

on:
  push:
    branches: [dev, test, main]
    paths:
      - "src/**"
      - "test/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  ORG: bcgov

  # ---- Image name for this repo/service ----
  # This will publish: ghcr.io/bcgov/file-transfer:<tag>
  SERVICE_FILE_TRANSFER: file-transfer

  # ---- GitOps repo + overlay locations ----
  GITOPS_REPO: bcgov-c/tenant-gitops-dec59b
  GITOPS_BASE_BRANCH: main
  GITOPS_OVERLAY: apps/file-transfer/overlays

  # ---- Image reference inside GitOps kustomization.yaml ----
  FILE_TRANSFER_IMAGE: ghcr.io/bcgov/file-transfer

jobs:
  # ----------------------------
  # 1) Detect env + tag + whether app changed
  # ----------------------------
  detect-changes:
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.filter.outputs.app }}
      envname: ${{ steps.env.outputs.envname }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      # Map branch -> environment name used in GitOps overlays
      - id: env
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            dev)  echo "envname=dev"  >> "$GITHUB_OUTPUT" ;;
            test) echo "envname=test" >> "$GITHUB_OUTPUT" ;;
            main) echo "envname=prod" >> "$GITHUB_OUTPUT" ;;
            *)    echo "Unsupported branch ${GITHUB_REF_NAME}" ; exit 1 ;;
          esac

      # Tag format: <env>-<shortsha> (e.g., dev-1a2b3c4)
      - id: tag
        shell: bash
        run: |
          set -euo pipefail
          ENV="${{ steps.env.outputs.envname }}"
          echo "tag=${ENV}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Detect whether anything relevant to the app changed
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'src/**'
              - 'test/**'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile'
              - '.github/workflows/**'

  # ----------------------------
  # 2) Build & push file-transfer image (only if app changed)
  # ----------------------------
  build-file-transfer:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # App is at repo root => context: .
      - name: Build & push file-transfer
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.SERVICE_FILE_TRANSFER }}:${{ needs.detect-changes.outputs.tag }}

  # ----------------------------
  # 3) Update GitOps overlay with newTag
  #    - dev: push directly to GitOps main
  #    - test/prod: create a branch (you open PR to GitOps main)
  # ----------------------------
  update-gitops:
    needs: [detect-changes, build-file-transfer]
    if: >-
      always() &&
      needs.detect-changes.outputs.app == 'true' &&
      needs.build-file-transfer.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v6
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: ${{ env.GITOPS_BASE_BRANCH }}
          token: ${{ secrets.GITOPS_PUSH_TOKEN }}
          path: gitops

      - name: Install yq
        shell: bash
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update overlay image tag (kustomize)
        shell: bash
        run: |
          set -euo pipefail
          ENV="${{ needs.detect-changes.outputs.envname }}"
          TAG="${{ needs.detect-changes.outputs.tag }}"
          FILE="gitops/${{ env.GITOPS_OVERLAY }}/${ENV}/kustomization.yaml"
          IMAGE="${{ env.FILE_TRANSFER_IMAGE }}"

          if [[ ! -f "$FILE" ]]; then
            echo "ERROR: kustomization not found: $FILE"
            echo "TIP: Check env.GITOPS_OVERLAY matches your GitOps repo structure."
            exit 1
          fi

          # Fail if image entry doesn't exist (prevents silent no-op)
          if ! yq e '.images[]? | select(.name=="'"$IMAGE"'") | .name' "$FILE" | grep -q .; then
            echo "ERROR: image '$IMAGE' not found in $FILE"
            echo "INFO: current images in file:"
            yq e '.images[]?.name' "$FILE" || true
            exit 1
          fi

          yq -i '(.images[] | select(.name=="'"$IMAGE"'")).newTag = "'"$TAG"'"' "$FILE"
          echo "Updated $IMAGE -> $TAG in $FILE"

      - name: Show Git diff (debug)
        shell: bash
        run: |
          set -euo pipefail
          cd gitops
          git diff --name-only || true
          git diff || true

      - name: Commit & push (dev direct, test/prod branch)
        shell: bash
        run: |
          set -euo pipefail
          cd gitops
          git config user.email "actions@github.com"
          git config user.name "github-actions"

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No GitOps changes to commit."
            exit 0
          fi

          ENV="${{ needs.detect-changes.outputs.envname }}"
          TAG="${{ needs.detect-changes.outputs.tag }}"
          BR="promote/${ENV}/${{ github.repository }}-${TAG}"

          if [[ "$ENV" == "dev" ]]; then
            git add .
            git commit -m "Promote to dev: ${{ github.repository }} ${TAG}"
            git push origin "${{ env.GITOPS_BASE_BRANCH }}"
            echo "Pushed dev promotion directly to GitOps main."
            exit 0
          fi

          # test/prod: create a branch; you open a PR to GitOps main
          git checkout -b "$BR"
          git add .
          git commit -m "Promote to ${ENV}: ${{ github.repository }} ${TAG}"
          git push -u origin "$BR"
          echo "Created branch $BR in GitOps repo. Open a PR to main."

  # ----------------------------
  # 4) Summary (always prints what happened)
  # ----------------------------
  summary:
    needs: [detect-changes, build-file-transfer, update-gitops]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Print summary
        shell: bash
        run: |
          echo "Env:            ${{ needs.detect-changes.outputs.envname }}"
          echo "App changed:     ${{ needs.detect-changes.outputs.app }}"
          echo "Image tag:       ${{ needs.detect-changes.outputs.tag }}"
          echo "Build result:    ${{ needs.build-file-transfer.result }}"
          echo "GitOps result:   ${{ needs.update-gitops.result }}"
          echo "Image pushed:    ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.SERVICE_FILE_TRANSFER }}:${{ needs.detect-changes.outputs.tag }}"
