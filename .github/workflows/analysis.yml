name: Analysis

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    branches: [dev, test, main]
  push:
    branches: [dev, test, main]
  schedule:
    - cron: "0 11 * * 0" # Sundays
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------
  # 1) Detect what changed
  # ----------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'src/**'
              - 'test/**'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile'
              - '.github/workflows/**'

  # ----------------------------
  # 2) App tests (only when app changed, and not draft)
  # ----------------------------
  app-tests:
    name: App Tests
    needs: [changes]
    if: >
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: bcgov/action-test-and-analyse@c20d16c26d9b7e6e486f01702880053ed4ebdc91
        with:
          commands: |
            npm ci
            npm run lint
            npm run test:cov
          dir: .
          node_version: "22"
          supply_scan: true

  # ----------------------------
  # 3) Trivy Security Scan
  # Required by branch protection (code scanning tool)
  # ----------------------------
  trivy:
    name: Trivy Security Scan
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner (filesystem)
        id: trivy_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
          scanners: vuln,secret,config
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  # ----------------------------
  # 4) Always report ONE required check name: "Analysis Results"
  # ----------------------------
  results:
    name: Analysis Results
    if: always()
    needs: [changes, app-tests, trivy]
    runs-on: ubuntu-24.04
    steps:
      - name: Gate on failures only (skipped is OK)
        shell: bash
        run: |
          set -euo pipefail
          echo "app-tests: ${{ needs.app-tests.result }}"
          echo "trivy:     ${{ needs.trivy.result }}"

          for r in "${{ needs.app-tests.result }}" "${{ needs.trivy.result }}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "One or more jobs failed/cancelled."
              exit 1
            fi
          done

          echo "Success!"
