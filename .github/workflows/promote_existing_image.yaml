name: Promote Existing Image (GitOps PR) - file-transfer

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (updates the matching overlay in the GitOps repo)"
        type: choice
        required: true
        options: [dev, test, prod]
      tag:
        description: "Image tag to promote (e.g. dev-abc1234, v1.2.3)"
        type: string
        required: true

concurrency:
  group: promote-file-transfer-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # GitOps repo (private) that ArgoCD watches
  GITOPS_REPO: bcgov-c/tenant-gitops-dec59b
  GITOPS_BASE_BRANCH: main

  # Where your overlays live inside the GitOps repo
  FILE_TRANSFER_OVERLAY: apps/file-transfer/overlays

  # Image name referenced in kustomization.yaml
  FILE_TRANSFER_IMAGE: ghcr.io/bcgov/file-transfer

jobs:
  promote:
    name: Promote file-transfer image tag in GitOps
    runs-on: ubuntu-24.04

    steps:
      # 1) Checkout GitOps repo
      # persist-credentials: false prevents "Duplicate header: Authorization"
      - name: Checkout GitOps repo
        uses: actions/checkout@v6
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: ${{ env.GITOPS_BASE_BRANCH }}
          token: ${{ secrets.GITOPS_PUSH_TOKEN }}
          path: gitops
          persist-credentials: false

      # 2) Install yq
      - name: Install yq
        shell: bash
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      # 3) Validate inputs + compute PR branch name
      - name: Validate inputs and compute vars
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          ENV="${{ inputs.environment }}"
          TAG="${{ inputs.tag }}"

          [[ "$ENV" =~ ^(dev|test|prod)$ ]] || { echo "Invalid environment: $ENV" ; exit 1; }
          [[ -n "$TAG" ]] || { echo "Tag is required" ; exit 1; }

          SAFE_TAG="${TAG//\//-}"
          SAFE_REPO="${GITHUB_REPOSITORY//\//-}"

          {
            echo "env=$ENV"
            echo "tag=$TAG"
            echo "branch=promote/${ENV}/${SAFE_REPO}/file-transfer/${SAFE_TAG}"
          } >> "$GITHUB_OUTPUT"

      # 4) Update the GitOps overlay (ONLY file-transfer)
      - name: Update overlay image tag (file-transfer only)
        shell: bash
        run: |
          set -euo pipefail

          ENV="${{ steps.vars.outputs.env }}"
          TAG="${{ steps.vars.outputs.tag }}"

          FILE="gitops/${{ env.FILE_TRANSFER_OVERLAY }}/${ENV}/kustomization.yaml"
          IMAGE="${{ env.FILE_TRANSFER_IMAGE }}"

          if [[ ! -f "$FILE" ]]; then
            echo "ERROR: Missing file: $FILE"
            exit 1
          fi

          export IMAGE TAG

          # Fail fast if the image entry doesn't exist
          if ! yq e '.images[]? | select(.name == strenv(IMAGE)) | .name' "$FILE" | grep -q .; then
            echo "ERROR: Image '$IMAGE' not found in $FILE"
            echo "INFO: Current images in $FILE:"
            yq e '.images[]?.name' "$FILE" || true
            exit 1
          fi

          yq -i '(.images[] | select(.name == strenv(IMAGE))).newTag = strenv(TAG)' "$FILE"
          echo "Updated $IMAGE -> $TAG in $FILE"

      # 5) Show diff
      - name: Show diff
        shell: bash
        run: |
          set -euo pipefail
          cd gitops
          git diff --stat
          git diff

      # 6a) dev: commit + push directly to GitOps main
      - name: Commit & push directly to GitOps main (dev)
        if: steps.vars.outputs.env == 'dev'
        shell: bash
        run: |
          set -euo pipefail
          cd gitops
          git config user.email "actions@github.com"
          git config user.name "github-actions"

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No GitOps changes to commit."
            exit 0
          fi

          git add .
          git commit -m "Promote file-transfer to dev: ${{ steps.vars.outputs.tag }}"
          git push origin "${{ env.GITOPS_BASE_BRANCH }}"

      # 6b) test/prod: open PR
      - name: Create PR in GitOps repo (test/prod)
        if: steps.vars.outputs.env != 'dev'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITOPS_PUSH_TOKEN }}
          path: gitops
          base: ${{ env.GITOPS_BASE_BRANCH }}
          branch: ${{ steps.vars.outputs.branch }}
          delete-branch: true
          commit-message: "Promote file-transfer to ${{ steps.vars.outputs.env }}: ${{ steps.vars.outputs.tag }}"
          title: "Promote file-transfer to ${{ steps.vars.outputs.env }}: ${{ steps.vars.outputs.tag }}"
          body: |
            This PR promotes an existing image tag to the GitOps overlays.

            - Environment: `${{ steps.vars.outputs.env }}`
            - Service: `file-transfer`
            - Tag: `${{ steps.vars.outputs.tag }}`
